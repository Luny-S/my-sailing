[project]
name = "my-sailing"
version = "0.1.0"
description = "Sailing document template builder (PZZ / general)"
requires-python = ">=3.13"
dependencies = [
    "pymupdf>=1.27.2.3",
]

[project.scripts]
build-docs = "my_sailing.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_sailing"]
